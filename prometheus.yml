global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus lui-même
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Application Bookstore
  - job_name: 'bookstore-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app:8080']
        labels:
          application: 'bookstore'